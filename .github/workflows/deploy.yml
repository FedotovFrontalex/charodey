# ============================================================
#  Автодеплой статического лендинга «Чародеи» на GitHub Pages
#  Запускается автоматически при каждом пуше в main
#  (а также вручную: вкладка Actions → Run workflow)
#
#  Разовый шаг со стороны человека:
#  Settings → Pages → Source: "GitHub Actions"
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Сайт полностью статический (index.html + assets), этапа сборки нет —
      # публикуем корень репозитория как есть
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
